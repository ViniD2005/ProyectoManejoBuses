name: Reporte de Error / Bug
description: Formulario estructurado para reportar fallos o solicitudes de cambio en el sistema.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Completa los siguientes campos para registrar el incidente o solicitud.

  - type: dropdown
    id: modulo
    attributes:
      label: Módulo afectado
      description: Selecciona en qué parte del sistema ocurre el problema.
      options:
        - Frontend (Cliente / Admin)
        - Backend (API / Servicios)
        - Base de Datos
        - Otro
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del problema o cambio
      description: Explica qué ocurrió o qué cambio se requiere.
      placeholder: Describe detalladamente el comportamiento observado...
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Indica los pasos exactos para replicar el error.
      value: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Observar el error
    validations:
      required: false

  - type: checkboxes
    id: verificacion
    attributes:
      label: Verificación previa
      options:
        - label: Revisé que no exista un issue duplicado.
          required: true
